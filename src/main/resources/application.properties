server.port=${PORT:8080}
spring.application.name=internshield-backend

# MySQL Database Configuration (Supports Aiven, Railway, TiDB, Docker, and Localhost)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:internshield}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP) Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate Configuration (Non-destructive schema updates)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Octen AI Search Configuration
octen.api.url=${OCTEN_API_URL:https://api.octen.ai/search}
octen.api.key=${OCTEN_API_KEY:}
octen.api.connect-timeout-seconds=${OCTEN_CONNECT_TIMEOUT_SECONDS:10}
octen.api.read-timeout-seconds=${OCTEN_READ_TIMEOUT_SECONDS:30}
octen.api.default-result-count=${OCTEN_DEFAULT_RESULT_COUNT:5}

# Google Gemini AI Configuration
google.ai.api.key=${GOOGLE_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}
gemini.api.connect-timeout-seconds=${GEMINI_CONNECT_TIMEOUT_SECONDS:10}
gemini.api.read-timeout-seconds=${GEMINI_READ_TIMEOUT_SECONDS:60}
gemini.api.max-retries=${GEMINI_MAX_RETRIES:3}

# CORS Configuration (specific allowed origins for development)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000,http://127.0.0.1:8000}

