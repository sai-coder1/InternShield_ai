spring.application.name=internshield-backend-test

# Isolated H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:internshield_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test configuration for Octen Search
octen.api.url=https://api.octen.ai/search
octen.api.key=test-api-key
octen.api.connect-timeout-seconds=5
octen.api.read-timeout-seconds=5
octen.api.default-result-count=5
